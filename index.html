<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=https://www.libmbr.com/">
    
    <title>Redirecting</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        em {
            font-style: italic;
            color: #0056b3;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>

    <script>
        window.location.replace("https://www.libmbr.com/");
    </script>
</head>
<body>
    <div class="container">
        <p>301 not available now, falling back to JS redirect. You are redirecting to <em>https://www.libmbr.com/</em></p>
        <p>If you are not redirected automatically in a few seconds, please <a href="https://www.libmbr.com/">click here</a>.</p>
    </div>
</body>
</html>
